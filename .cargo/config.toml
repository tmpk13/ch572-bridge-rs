# The CH572 core is a QingKe V3C (RV32IMBC, no atomics), so the plain
# imc target applies.  Setting build.target means host tests need an
# explicit --target (mise run test passes the host triple).
[build]
target = "riscv32imc-unknown-none-elf"

# The CH572D's ROM bootloader over USB, through isp.py: wchisp reports
# success on this chip while writing nothing (see isp.py).  isp.py waits
# 30 s for the bootloader.  The path is relative, so run cargo from the
# repository root (mise run flash does).
[target.riscv32imc-unknown-none-elf]
runner = "pixi exec -s python=3.12 -s pyusb -s libusb python -I isp.py --wait 30"
